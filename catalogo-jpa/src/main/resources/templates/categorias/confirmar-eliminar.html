<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Categoría</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<h1>Eliminar Categoría</h1>
<p>¿Seguro que desea eliminar la siguiente categoría?</p>
<ul>
    <li><strong>Nombre:</strong> <span th:text="${categoria.nombre}"></span></li>
    <li><strong>Descripción:</strong> <span th:text="${categoria.descripcion}"></span></li>
</ul>
<form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}" method="post">
    <button type="submit">Confirmar eliminación</button>
    <a th:href="@{/categorias}">Cancelar</a>
</form>
</body>
</html>
